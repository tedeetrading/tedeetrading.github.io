<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DAMSUNZ Hub</title>
<link rel="icon" type="image/png" href="favicon_rond.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#0b0b0b; --card:#151311; --line:#2a2622; --sun:#FFC42E; --orange:#FF8A1E; --txt:#FFF6E6; --dim:#a39a8e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  .logo { font-weight:800; letter-spacing:.2em; background:linear-gradient(90deg,var(--sun),var(--orange)); -webkit-background-clip:text; color:transparent; font-size:18px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; margin-left:12px; }
  nav button { background:none; border:1px solid var(--line); color:var(--dim); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:14px; }
  nav button.on { color:#111; background:var(--sun); border-color:var(--sun); font-weight:600; }
  .spacer { flex:1; }
  .who { color:var(--dim); font-size:13px; }
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  @media (max-width:1100px){ .duo{grid-template-columns:1fr} }
  main { max-width:1500px; margin:0 auto; padding:22px; }
  h2 { font-size:18px; margin:0 0 14px; color:var(--sun); font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  tr.sep td { padding:0; height:6px; background:var(--bg); border:0; }
  tr.today td { background:#2a1f0d; }
  td.b { font-weight:700; }
  [contenteditable] { outline:none; border-radius:6px; padding:2px 4px; margin:-2px -4px; }
  [contenteditable]:hover { background:#221d17; }
  [contenteditable]:focus { background:#2d2519; box-shadow:0 0 0 1px var(--orange); }
  .muted { color:var(--dim); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card b { color:var(--sun); }
  a { color:var(--sun); }
  #login { max-width:360px; margin:12vh auto; text-align:center; }
  #login input { width:100%; padding:11px; margin:6px 0; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--txt); font-size:15px; }
  .btn { background:var(--sun); color:#111; border:0; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; font-size:15px; }
  .btn.ghost { background:none; color:var(--dim); border:1px solid var(--line); }
  .toast { position:fixed; bottom:18px; right:18px; background:var(--card); border:1px solid var(--orange); padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
  td.kanaal { text-align:center; vertical-align:middle; }
  .icons { display:inline-flex; align-items:center; gap:5px; }
  .ic { display:inline-flex; align-items:center; }
  .ic svg, .ic img { display:block; }
  .c-more { display:none; }
  .selecting tr[data-id] { cursor:pointer; }
  tr.sel td { background:#3a2a0a !important; }
  tr.sel { outline:2px solid var(--sun); outline-offset:-2px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .more { display:grid; gap:6px; padding-top:8px; margin-top:6px; border-top:1px solid var(--line); font-size:14px; }
  .morebtns { display:flex; gap:8px; margin-top:4px; }
  .morebtns .btn { text-decoration:none; font-size:13px; padding:8px 12px; }
  .pill.ok { color:#111; background:var(--sun); border-color:var(--sun); }
  .idtag { font-size:11px; color:var(--dim); margin-left:4px; }
  .idtag:empty::before { content: attr(data-ph); opacity:.5; }
  td { white-space:normal; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--dim); }
  @media (max-width:700px){
    header { padding:10px 12px; gap:8px; flex-wrap:nowrap; }
    .logo { font-size:15px; letter-spacing:.12em; }
    nav { margin-left:4px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    nav button { white-space:nowrap; padding:5px 10px; font-size:13px; }
    .who, .spacer { display:none; }
    main { padding:14px 10px; }
    h2 { font-size:16px; }
    .btn { padding:7px 10px; font-size:13px; }
    table { background:none; }
    table, tbody, tr, td { display:block; }
    tr:has(th) { display:none !important; }
    tr.today { background:#2a1f0d !important; border-color:var(--orange) !important; }
    tr.today td { background:none !important; }
    .shiftlbl { display:none; }
    tr.open .c-more { display:block; grid-area:more; }
    tr:not(.sep):not(.open)::after { content:''; }
    tr.sep { height:10px; }
    tr:not(.sep) { display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"date date status" "title title title" "kanaal len ctl" "more more more"; cursor:pointer; align-items:center;
      gap:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
    td { border:0; padding:0; }
    .c-date { grid-area:date; color:var(--dim); font-size:13px; }
    .c-status { grid-area:status; justify-self:end; }
    .c-status .pill { display:block; width:76px; box-sizing:border-box; text-align:center; font-size:11.5px; padding:4px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .c-video { display:contents; }
    .c-video .ttl { grid-area:title; font-size:17px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .c-video:not(.b) .ttl { font-weight:500; }
    .c-video .ttl a { font-size:17px; }
    .c-video > .idtag { display:none; }
    .c-video .songctl { grid-area:ctl; margin:0; justify-self:end; gap:8px; }
    .songctl .playbtn, .songctl .qbtn { width:34px; height:34px; font-size:13px; }
    .songctl .qbtn { border:1px solid var(--line); font-size:16px; }
    .c-kanaal { grid-area:kanaal; text-align:left !important; }
    .c-len { grid-area:len; color:var(--dim); font-size:13px; text-align:left; }
    .c-len::before { content:'· '; }
  }
  .kpis { display:grid; grid-template-columns:repeat(2,minmax(120px,170px)) minmax(220px,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .kpi .kv { font-size:32px; font-weight:800; line-height:1.1; background:linear-gradient(90deg,var(--sun),var(--orange)); -webkit-background-clip:text; color:transparent; }
  .kpi .kv.dim { background:none; color:var(--txt); }
  .kpi .kl { color:var(--dim); font-size:13px; }
  .kbar { height:8px; border-radius:8px; background:#2a2622; overflow:hidden; margin-top:8px; }
  .kbar i { display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,var(--sun),var(--orange)); }
  @media (max-width:700px){ .kpis { grid-template-columns:1fr 1fr; } .kpi.wide { grid-column:1 / -1; } }
  .todoadd { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .todoadd input, .todoadd select { background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px 12px; font-size:15px; }
  .todoadd input { flex:1; min-width:200px; }
  .todos { display:grid; gap:8px; }
  .todo { display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .todo input[type=checkbox] { width:22px; height:22px; accent-color:var(--sun); margin-top:2px; flex:none; cursor:pointer; }
  .todo .tt { flex:1; min-width:0; display:grid; gap:4px; }
  .todo.done .tt > div:first-child { text-decoration:line-through; color:var(--dim); }
  .tdel { background:none; border:0; color:var(--dim); cursor:pointer; font-size:14px; }
  .tbar { display:flex; gap:10px; flex-wrap:wrap; }
  @media (max-width:700px){
    .tbar { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; width:100%; }
    .tbar:has(#swapBtn:not([hidden])) .shufmob { display:none; }
    .tbar .btn { padding:9px 4px; font-size:13px; white-space:nowrap; text-align:center; }
    .tbar .lg { display:none; }
  }
  .shufmob { display:none; }
  @media (max-width:700px){ .shufmob { display:inline-block; } }
  .shufbtn { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; border:0; background:var(--sun); color:#111; box-shadow:0 2px 10px #ffc42e55; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .shufbtn:hover { background:var(--orange); }
  .shufbtn svg { width:16px; height:16px; fill:currentColor; }
  .songctl { display:inline-flex; gap:6px; align-items:center; margin-left:8px; vertical-align:middle; }
  .playbtn { width:30px; height:30px; border-radius:50%; border:none; background:var(--sun); color:#111; font-size:13px; cursor:pointer; padding:0; }
  .playbtn.on { background:#ff8a1e; }
  .qbtn { width:30px; height:30px; border-radius:50%; border:none; background:none; color:var(--dim); font-size:18px; cursor:pointer; padding:0; line-height:1; letter-spacing:1px; }
  .qbtn:hover { color:var(--txt); background:#221d17; }
  #ctx { position:fixed; z-index:9; background:#282420; border-radius:6px; box-shadow:0 8px 24px #000a; padding:4px; min-width:210px; }
  #ctx[hidden] { display:none; }
  #ctx button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); padding:10px 12px; border-radius:4px; font-size:14px; cursor:pointer; }
  #ctx button:hover { background:#3a342d; }
  #pbar { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(180deg,#1a1714,#0e0c0b); border-top:1px solid #2f2a24; padding:10px 18px calc(10px + env(safe-area-inset-bottom)); z-index:6;
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr); grid-template-areas:"info ctrl side"; align-items:center; gap:14px; box-shadow:0 -10px 30px #0008; }
  #pbar[hidden] { display:none; }
  #pbar .pl { grid-area:info; display:flex; align-items:center; gap:12px; min-width:0; }
  #pbar .art { width:48px; height:48px; border-radius:8px; flex:none; background:#000 url(favicon_rond.png) center/cover; box-shadow:0 2px 10px #0009; }
  #pbar .meta { min-width:0; } #pbar .meta b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--txt); font-size:15px; }
  #pbar .meta span { font-size:12px; color:var(--dim); letter-spacing:.08em; }
  #pbar .pc { grid-area:ctrl; display:grid; gap:6px; justify-items:center; }
  #pbar .pbtns { display:flex; align-items:center; gap:22px; }
  #pbar .ib { background:none; border:0; color:#cfc6ba; cursor:pointer; padding:4px; display:inline-flex; align-items:center; }
  #pbar .ib svg { width:20px; height:20px; fill:currentColor; display:block; }
  #pbar .ib:hover { color:var(--txt); } #pbar .ib.on { color:var(--sun); }
  #pbar .ib:disabled { opacity:.3; cursor:default; }
  #pbar .big { width:40px; height:40px; border-radius:50%; border:0; background:var(--sun); color:#111; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 12px #ffc42e40; }
  #pbar .big svg { width:18px; height:18px; fill:#111; display:block; }
  #pbar .prog { display:flex; align-items:center; gap:10px; width:100%; max-width:620px; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #pbar input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:4px; margin:0; cursor:pointer;
    background:linear-gradient(90deg,var(--sun) 0,var(--orange) var(--p,0%),#3a342d var(--p,0%)); }
  #pbar input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; border:0; box-shadow:0 1px 4px #0008; }
  #pbar input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#fff; border:0; }
  #pbar .pr { grid-area:side; display:flex; justify-content:flex-end; }
  @media (max-width:700px){
    #pbar { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"info side" "ctrl ctrl"; padding:12px 16px calc(22px + env(safe-area-inset-bottom)); gap:10px 10px; }
    #pbar .art { width:42px; height:42px; }
    #pbar .pbtns { gap:30px; } #pbar .big { width:46px; height:46px; } #pbar .ib svg { width:24px; height:24px; }
    #pbar .prog { max-width:none; }
  }
  #qpanel { position:fixed; right:0; top:0; bottom:calc(96px + env(safe-area-inset-bottom)); width:340px; max-width:92vw; background:#121110; border-left:1px solid var(--line); z-index:7; padding:18px; overflow:auto; }
  #qpanel[hidden] { display:none; }
  #qpanel h3 { margin:0 0 14px; font-size:18px; } #qpanel h4 { margin:18px 0 8px; font-size:14px; color:var(--dim); font-weight:600; }
  #qpanel .qi { display:flex; align-items:center; gap:8px; padding:8px; border-radius:6px; } #qpanel .qi:hover { background:#1e1b18; }
  #qpanel .qi span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } #qpanel .qi.now span { color:var(--sun); }
  #qpanel .qi button { background:none; border:0; color:var(--dim); cursor:pointer; font-size:14px; }
  body:has(#pbar:not([hidden])) main { padding-bottom:calc(150px + env(safe-area-inset-bottom)); }
  @media (max-width:700px){ #qpanel { width:100vw; bottom:0; } }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="logo" style="font-size:28px">DAMSUNZ</div>
  <p class="muted">Hub · alleen voor TD Trading</p>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Wachtwoord" autocomplete="current-password">
  <p><button class="btn" id="go">Inloggen</button> <button class="btn ghost" id="su">Account aanmaken</button></p>
  <p><a href="#" id="fg" class="muted">Wachtwoord vergeten?</a></p>
  <div id="newpw" hidden><input id="pw2" type="password" placeholder="Nieuw wachtwoord" autocomplete="new-password"><p><button class="btn" id="setpw">Wachtwoord opslaan</button></p></div>
  <p class="muted" id="msg"></p>
</div>

<div id="app" hidden>
  <header>
    <span class="logo">DAMSUNZ</span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="out" style="padding:5px 10px;font-size:13px">Uit</button>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast">Opgeslagen</div>
<div id="pbar" hidden></div>
<div id="qpanel" hidden></div>
<div id="ctx" hidden></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_KEY } from './config.js';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAGEN = ['zo','ma','di','wo','do','vr','za'], MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const today = new Date().toISOString().slice(0,10);
const nlDatum = d => { const x = new Date(d+'T12:00:00'); return `${DAGEN[x.getDay()]} ${x.getDate()} ${MND[x.getMonth()]}`; };
const week = d => { const x = new Date(d+'T12:00:00'); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x.toISOString().slice(0,10); };
const yt = id => id ? `https://studio.youtube.com/video/${id}/edit` : null;
const badge = st => { const ok = /klaar|ingepland|live|✅/i.test(st||''); return `<span class="pill" style="${ok?'color:#111;background:var(--sun);border-color:var(--sun)':''}">${esc(st||'nog maken')}</span>`; };
const titleCell = (table, row, field='titel') => {
  const m = esc(JSON.stringify({id:row.id}));
  const t = `<span class="ttl">${row.youtube_id ? `<a href="${yt(row.youtube_id)}" target="_blank" rel="noopener">${esc(row[field])} ↗</a>` : esc(row[field])}</span>`;
  return `${t} <span class="idtag" title="YouTube-ID (klik om te plakken)" data-t="${table}" data-m="${m}" data-f="youtube_id" data-ph="+ID">${esc(row.youtube_id||'')}</span>`;
};
const statusTag = (table, row) => {
  const ok = /klaar|ingepland|live|✅/i.test(row.status||'');
  return `<span class="pill ${ok?'ok':''}" title="Klik om de status te wijzigen" data-t="${table}" data-m="${esc(JSON.stringify({id:row.id}))}" data-f="status">${esc(row.status||'nog maken')}</span>`;
};
const ICON = {
  YouTube: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="16" rx="4" fill="#FF0033"/><path d="M9 4.5v7l6-3.5z" fill="#fff"/></svg>',
  Spotify: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#1ED760"/><path d="M4 6.2c2.8-.9 5.6-.6 8 .7M4.5 8.6c2.3-.7 4.6-.4 6.6.6M5 10.8c1.8-.5 3.5-.3 5 .5" stroke="#111" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>',
  TikTok: '<svg width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="#111" stroke="#444"/><path d="M9 3v6.6a2 2 0 1 1-1.6-2" stroke="#25F4EE" stroke-width="1.6" fill="none"/><path d="M9 3c.3 1.4 1.3 2.3 2.8 2.4" stroke="#FE2C55" stroke-width="1.6" fill="none"/></svg>',
  Instagram: '<svg width="16" height="16" viewBox="0 0 16 16"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".5" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect width="16" height="16" rx="4.5" fill="url(#ig)"/><rect x="3.5" y="3.5" width="9" height="9" rx="2.8" stroke="#fff" stroke-width="1.3" fill="none"/><circle cx="8" cy="8" r="2.1" stroke="#fff" stroke-width="1.3" fill="none"/></svg>',
  DistroKid: '<img src="distrokid.png" width="16" height="16" alt="DistroKid" style="border-radius:50%;display:block">',
  Facebook: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#1877F2"/><path d="M8.9 13V8.6h1.5l.2-1.7H8.9V5.8c0-.5.2-.8.8-.8h.9V3.5c-.2 0-.7-.1-1.3-.1-1.3 0-2.2.8-2.2 2.2v1.3H5.6v1.7h1.5V13z" fill="#fff"/></svg>',
};
const kanalen = (soort) => soort === 'song' ? ['YouTube','Spotify','DistroKid'] : soort === 'short' ? ['YouTube','TikTok','Instagram','Facebook'] : ['YouTube'];
const kanaalCell = soort => `<td class="kanaal c-kanaal"><span class="icons">${kanalen(soort).map(k => `<span title="${k}" class="ic">${ICON[k]}</span>`).join('')}</span></td>`;
const moreCell = (table, row, extra) => {
  const m = esc(JSON.stringify({id:row.id})), id = row.youtube_id;
  return `<td class="c-more"><div class="more">
    <div><span class="muted">Kanaal:</span> ${extra.kanaal}</div>
    <div><span class="muted">${extra.lenLabel}:</span> ${esc(extra.len)}</div>
    <div><span class="muted">Status:</span> <span data-t="${table}" data-m="${m}" data-f="status">${esc(row.status||'')}</span></div>
    <div><span class="muted">YouTube-ID:</span> <span data-t="${table}" data-m="${m}" data-f="youtube_id" data-ph="(plakken)" class="idtag">${esc(id||'')}</span></div>
    <div><span class="muted">Notitie:</span> <span data-t="${table}" data-m="${m}" data-f="notitie" data-ph="(toevoegen)" class="idtag">${esc(row.notitie||'')}</span></div>
    ${id ? `<div class="morebtns"><a class="btn" href="https://studio.youtube.com/video/${id}/edit" target="_blank" rel="noopener">Open in Studio</a> <a class="btn ghost" href="https://youtu.be/${id}" target="_blank" rel="noopener">Bekijk op YouTube</a></div>` : '<div class="muted">Nog niet op YouTube.</div>'}
  </div></td>`;
};
// Songs: afspelen + uploaden (privé opslag 'hub-songs', alleen voor ingelogde Hub-gebruikers)
const songCtl = v => v.audio ? `<span class="songctl"><button class="playbtn" data-audio="${esc(v.audio)}" data-title="${esc(v.titel)}" title="Afspelen">▶</button><button class="qbtn" data-audio="${esc(v.audio)}" data-title="${esc(v.titel)}" title="Meer opties">⋯</button></span>` : '';
// Speler zoals Spotify: ⋯-menu (Afspelen / Toevoegen aan wachtrij), spelerbalk onderin, wachtrijpaneel.
const player = new Audio(); let cur = null; const queue = []; const hist = [];
const fmt = t => isFinite(t) ? `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}` : '0:00';
async function playItem(item, fromBack) {
  const { data, error } = await sb.storage.from('hub-songs').createSignedUrl(item.audio, 3600);
  if (error) return toast('Fout: ' + error.message);
  if (cur && !fromBack) hist.push(cur);
  cur = item; player.src = data.signedUrl;
  try { await player.play(); } catch (e) { toast('Afspelen lukt niet: ' + e.message); }
  sync();
}
function toggle(item) { if (cur && cur.audio === item.audio) { player.paused ? player.play() : player.pause(); } else playItem(item); }
function next() { const n = queue.shift(); if (n) playItem(n); else { player.pause(); player.currentTime = 0; sync(); } }
function prev() { if (player.currentTime > 3 || !hist.length) { player.currentTime = 0; return; } if (cur) queue.unshift(cur); playItem(hist.pop(), true); }
function addToQueue(it) { if (!cur) return playItem(it); queue.push(it); toast('Toegevoegd aan wachtrij'); sync(); }
['play','pause'].forEach(ev => player.addEventListener(ev, () => sync()));
player.addEventListener('ended', next);
player.addEventListener('timeupdate', () => { const r = $('#pSeek'); if (r && !r.dragging) { r.max = player.duration || 0; r.value = player.currentTime; r.style.setProperty('--p', (player.duration ? player.currentTime / player.duration * 100 : 0) + '%'); $('#pT').textContent = fmt(player.currentTime); $('#pD').textContent = fmt(player.duration); } });
function sync() {
  document.querySelectorAll('.songctl .playbtn').forEach(b => { const on = !!cur && b.dataset.audio === cur.audio && !player.paused; b.classList.toggle('on', on); b.textContent = on ? '❚❚' : '▶'; });
  const bar = $('#pbar');
  if (!cur) { bar.hidden = true; $('#qpanel').hidden = true; return; }
  bar.hidden = false;
  const qOpen = !$('#qpanel').hidden;
  const I = { prev:'<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>', next:'<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>',
    play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>', pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>',
    queue:'<svg viewBox="0 0 24 24"><path d="M3 5h13v2H3zM3 10h13v2H3zM3 15h8v2H3zM17 13v6.2a2.5 2.5 0 1 1-2-2.45V11h5v2z"/></svg>' };
  const pct = player.duration ? (player.currentTime / player.duration * 100) : 0;
  bar.innerHTML = `<div class="pl"><div class="art"></div><div class="meta"><b>${esc(cur.title)}</b><span>DAMSUNZ</span></div></div>
    <div class="pc"><div class="pbtns"><button class="ib" id="pPrev" title="Vorige">${I.prev}</button>
      <button class="big" id="pPlay" title="${player.paused ? 'Afspelen' : 'Pauzeren'}">${player.paused ? I.play : I.pause}</button>
      <button class="ib" id="pNext" title="Volgende" ${queue.length ? '' : 'disabled'}>${I.next}</button></div>
      <div class="prog"><span id="pT">${fmt(player.currentTime)}</span><input type="range" id="pSeek" min="0" step="0.1" max="${player.duration || 0}" value="${player.currentTime}" style="--p:${pct}%"><span id="pD">${fmt(player.duration)}</span></div></div>
    <div class="pr"><button class="ib ${qOpen ? 'on' : ''}" id="pQ" title="Wachtrij">${I.queue}${queue.length ? `<small style="margin-left:4px;font-size:12px">${queue.length}</small>` : ''}</button></div>`;
  $('#pPlay').onclick = () => toggle(cur); $('#pNext').onclick = next; $('#pPrev').onclick = prev;
  $('#pQ').onclick = () => { $('#qpanel').hidden = !$('#qpanel').hidden; sync(); };
  const r = $('#pSeek'); r.oninput = () => { r.dragging = true; $('#pT').textContent = fmt(+r.value); r.style.setProperty('--p', (r.max > 0 ? r.value / r.max * 100 : 0) + '%'); }; r.onchange = () => { player.currentTime = +r.value; r.dragging = false; };
  const qp = $('#qpanel');
  if (!qp.hidden) {
    qp.innerHTML = `<h3>Wachtrij</h3><h4>Nu aan het afspelen</h4><div class="qi now"><span>${esc(cur.title)}</span></div>
      <h4>Hierna in wachtrij</h4>${queue.length ? queue.map((q, i) => `<div class="qi"><span>${esc(q.title)}</span><button data-pl="${i}" title="Nu afspelen">▶</button><button data-rm="${i}" title="Verwijderen uit wachtrij">✕</button></div>`).join('') + '<p><button class="btn ghost" id="qClear">Wachtrij wissen</button></p>' : '<p class="muted">Leeg. Klik bij een song op ⋯ → Toevoegen aan wachtrij.</p>'}`;
    qp.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { queue.splice(+b.dataset.rm, 1); sync(); });
    qp.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { const [it] = queue.splice(+b.dataset.pl, 1); playItem(it); });
    const c = $('#qClear'); if (c) c.onclick = () => { queue.length = 0; sync(); };
  }
}
function openMenu(it, x, y) {
  const m = $('#ctx');
  m.innerHTML = `<button data-a="play">${cur && cur.audio === it.audio && !player.paused ? 'Pauzeren' : 'Afspelen'}</button><button data-a="queue">Toevoegen aan wachtrij</button>`;
  m.hidden = false; m.style.left = Math.min(x, innerWidth - 220) + 'px'; m.style.top = Math.min(y, innerHeight - 110) + 'px';
  m.querySelector('[data-a=play]').onclick = () => { m.hidden = true; toggle(it); };
  m.querySelector('[data-a=queue]').onclick = () => { m.hidden = true; addToQueue(it); };
}
document.addEventListener('click', e => { if (!e.target.closest('#ctx,.qbtn')) $('#ctx').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#ctx').hidden = true; });
function songHandlers(root) {
  const item = b => ({ audio: b.dataset.audio, title: b.dataset.title });
  root.querySelectorAll('.songctl .playbtn').forEach(b => b.onclick = e => { e.stopPropagation(); toggle(item(b)); });
  root.querySelectorAll('.qbtn').forEach(b => b.onclick = e => { e.stopPropagation(); const r = b.getBoundingClientRect(); openMenu(item(b), r.left, r.bottom + 4); });
  root.querySelectorAll('tr[data-id]').forEach(tr => { const b = tr.querySelector('.qbtn'); if (b) tr.addEventListener('contextmenu', e => { e.preventDefault(); openMenu(item(b), e.clientX, e.clientY); }); });
  sync();
}
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'), 1400); };

async function save(table, match, field, value) {
  const { error } = await sb.from(table).update({ [field]: value, ...(table!=='hub_kosten'&&table!=='hub_links' ? {updated_at:new Date().toISOString()} : {}) }).match(match);
  toast(error ? 'Fout: ' + error.message : 'Opgeslagen');
}
function editable(el) {
  el.querySelectorAll('[data-t]').forEach(c => {
    c.contentEditable = true;
    c.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); c.blur(); } });
    c.addEventListener('blur', () => save(c.dataset.t, JSON.parse(c.dataset.m), c.dataset.f, c.textContent.trim() || null));
  });
}

const TABS = {
  async Planning(MODE = 'planning') {
    const [{ data: vids }, { data: sh }] = await Promise.all([
      sb.from('hub_videos').select('*').order('datum'), sb.from('hub_shorts').select('*').order('datum').order('tijd')]);
    const sep = (list, cols, render) => { let r = '', prev = null;
      for (const x of list) { const w = week(x.d); if (prev && w !== prev) r += `<tr class="sep"><td colspan="${cols}"></td></tr>`; prev = w; r += render(x); }
      return r; };
    const vRows = sep((vids||[]).map(v => ({ d: v.datum, v })), 5, ({ d, v }) => {
      const m = esc(JSON.stringify({id:v.id})), big = v.soort !== 'song';
      return `<tr data-id="${v.id}" class="${d===today?'today':''}"><td class="c-date ${d===today?'b':''}">${nlDatum(d)}${d===today?' (vandaag)':''}</td>${kanaalCell(v.soort)}
        <td class="c-video ${big?'b':''}">${titleCell('hub_videos', v)}${songCtl(v)}</td><td class="c-len">${esc(v.lengte)}</td>
        <td class="c-status">${statusTag('hub_videos', v)}</td>${moreCell('hub_videos', v, {kanaal: kanalen(v.soort).join(', '), lenLabel:'Lengte', len: v.lengte})}</tr>`; });
    const sRows = sep((sh||[]).map(x => ({ d: x.datum, x })), 5, ({ d, x }) =>
      `<tr data-id="${x.id}" class="${d===today?'today':''}"><td class="c-date ${d===today?'b':''}">${nlDatum(d)}${d===today?' (vandaag)':''}</td>
        <td class="c-len">${esc(x.tijd)}</td>${kanaalCell('short')}<td class="c-video">${titleCell('hub_shorts', x)}</td><td class="c-status">${statusTag('hub_shorts', x)}</td>${moreCell('hub_shorts', x, {kanaal: kanalen('short').join(', '), lenLabel:'Tijd', len: x.tijd})}</tr>`);
    const bar = title => `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <h2 style="margin:0">${title}</h2><span class="spacer"></span><div class="tbar">
        <button class="btn ghost" id="shiftMin">◀ 1 dag<span class="lg"> eerder</span></button>
        <button class="btn ghost" id="shiftPlus">1 dag<span class="lg"> later</span> ▶</button>
        <button class="btn ghost" id="selBtn">Selecteren</button>
        <button class="btn" id="swapBtn" hidden>Omwisselen (0/2)</button>${MODE === 'shorts' ? '' : '<button class="btn shufmob" id="shufBtn2">⤮ Shuffle</button>'}</div></div>`;
    const isKlaar = st => /klaar|ingepland|live|✅/i.test(st||'');
    const kpi = (list, parts) => {
      const tot = list.length, ok = list.filter(x => isKlaar(x.status)).length, pct = tot ? Math.round(ok / tot * 100) : 0;
      const sub = parts.map(([lbl, l]) => { const o = l.filter(x => isKlaar(x.status)).length; return `<span class="pill">${lbl} ${o}/${l.length}</span>`; }).join(' ');
      return `<div class="kpis"><div class="kpi"><div class="kv">${ok}</div><div class="kl">Klaar</div></div>
        <div class="kpi"><div class="kv dim">${tot - ok}</div><div class="kl">Nog te maken</div></div>
        <div class="kpi wide"><div class="kl" style="display:flex;justify-content:space-between"><span>Voortgang</span><b style="color:var(--sun)">${pct}%</b></div>
          <div class="kbar"><i style="width:${pct}%"></i></div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${sub}</div></div></div>`;
    };
    const V = vids || [];
    const kpiHtml = MODE === 'shorts' ? kpi(sh || [], [])
      : kpi(V, [['Sets', V.filter(v => v.soort !== 'song' && !/uurmix/i.test(v.titel))], ['Uurmixen', V.filter(v => /uurmix/i.test(v.titel))], ['Songs', V.filter(v => v.soort === 'song')]]);
    const note = '<p class="muted">Titel met ↗ = staat op YouTube: klik om hem in Studio te openen. Status wijzigen: klik op het label, typ, Enter. YouTube-ID plakken: klik op +ID.</p>';
    $('#view').innerHTML = MODE === 'shorts'
      ? bar('Shorts — 3 per dag') + kpiHtml + `<table><tr><th>Datum</th><th>Tijd</th><th style="text-align:center">Kanaal</th><th>Short</th><th>Status</th></tr>${sRows}</table>` + note
      : bar("Planning lange video's (18:00 NL)") + kpiHtml + `<table><tr><th>Datum</th><th style="text-align:center">Kanaal</th><th>Video</th><th>Lengte</th><th style="position:relative">Status<button class="shufbtn" id="shufBtn" title="Shuffle: alles in willekeurige volgorde afspelen"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-2.9 3.9-1.25-1.67L13.4 6H17V3zM3 6h4.6l8.8 12H17v-3l4 4-4 4v-3h-3.6L5.6 8H3V6zm0 10h2.6l2.15-2.87L9 14.8 7.4 18H3v-2z"/></svg></button></th></tr>${vRows}</table>` + note;
    let selecting = false, sel = [];
    const tabel = MODE === 'shorts' ? 'hub_shorts' : 'hub_videos';
    const upd = () => { $('#swapBtn').textContent = `Omwisselen (${sel.length}/2)`; $('#swapBtn').disabled = sel.length !== 2; };
    $('#selBtn').onclick = () => {
      selecting = !selecting; sel = [];
      $('#view').querySelectorAll('tr.sel').forEach(t => t.classList.remove('sel'));
      $('#selBtn').textContent = selecting ? 'Annuleren' : 'Selecteren';
      $('#swapBtn').hidden = !selecting; $('#view').classList.toggle('selecting', selecting); upd();
    };
    $('#swapBtn').onclick = async () => {
      if (sel.length !== 2) return;
      const { error } = await sb.rpc('hub_swap', { tabel, a: +sel[0], b: +sel[1] });
      toast(error ? 'Fout: ' + error.message : 'Omgewisseld'); if (!error) show();
    };
    $('#view').querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if (e.target.closest('a,[contenteditable],button,label,input')) return;
      if (selecting) {
        const id = tr.dataset.id, i = sel.indexOf(id);
        if (i >= 0) { sel.splice(i, 1); tr.classList.remove('sel'); }
        else if (sel.length < 2) { sel.push(id); tr.classList.add('sel'); }
        upd(); return;
      }
      if (window.matchMedia('(max-width:700px)').matches) tr.classList.toggle('open');
    }));
    const shift = async n => {
      const { error } = await sb.rpc('hub_shift', { dagen: n });
      toast(error ? 'Fout: ' + error.message : (n > 0 ? 'Alles 1 dag later' : 'Alles 1 dag eerder'));
      if (!error) show();
    };
    $('#shiftMin').onclick = () => shift(-1);
    $('#shiftPlus').onclick = () => shift(1);
    editable($('#view')); songHandlers($('#view'));
    const shuffleAll = e => { e.stopPropagation();
      const items = [...$('#view').querySelectorAll('.songctl .playbtn')].map(b => ({ audio: b.dataset.audio, title: b.dataset.title }));
      if (!items.length) return toast('Nog niets om af te spelen');
      for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
      queue.length = 0; queue.push(...items.slice(1)); playItem(items[0]); toast('Shuffle: ' + items.length + ' nummers'); };
    ['#shufBtn', '#shufBtn2'].forEach(id => { const b = $(id); if (b) b.onclick = shuffleAll; });
  },
  async Doelen() {
    const { data } = await sb.from('hub_doelen').select('*').order('soort').order('volgorde');
    const groups = {};
    (data||[]).forEach(d => (groups[d.soort] ??= []).push(d));
    let html = '';
    for (const [soort, list] of Object.entries(groups)) {
      html += `<h2 style="margin-top:${html?'26px':'0'}">${esc(soort)}</h2><div class="grid">`;
      for (const d of list) {
        const m = esc(JSON.stringify({id:d.id}));
        html += `<div class="card"><div style="font-size:34px;font-weight:800;color:var(--sun);line-height:1.1"><span data-t="hub_doelen" data-m="${m}" data-f="waarde">${esc(d.waarde)}</span>
          <span class="muted" style="font-size:14px;font-weight:400">${esc(d.per)}</span></div>
          <div style="font-weight:600;margin-top:4px">${esc(d.doel)}</div>
          <div class="muted" data-t="hub_doelen" data-m="${m}" data-f="notitie">${esc(d.notitie||'')}</div></div>`;
      }
      html += '</div>';
    }
    $('#view').innerHTML = html || '<p class="muted">Nog geen doelen.</p>';
    editable($('#view'));
  },
  async 'To-do'() {
    const { data } = await sb.from('hub_todo').select('*').order('klaar').order('volgorde').order('id');
    const rows = (data || []).map(t => { const m = esc(JSON.stringify({id:t.id}));
      return `<div class="todo ${t.klaar ? 'done' : ''}"><input type="checkbox" data-id="${t.id}" ${t.klaar ? 'checked' : ''}>
        <div class="tt"><div data-t="hub_todo" data-m="${m}" data-f="taak">${esc(t.taak)}</div>
        <div class="muted"><span class="pill">${esc(t.wie || '')}</span> <span data-t="hub_todo" data-m="${m}" data-f="notitie" class="idtag" data-ph="(notitie)">${esc(t.notitie || '')}</span></div></div>
        <button class="tdel" data-del="${t.id}" title="Verwijderen">✕</button></div>`; }).join('');
    const open = (data || []).filter(t => !t.klaar).length;
    $('#view').innerHTML = `<h2>To-do <span class="pill">${open} open</span></h2>
      <div class="todoadd"><input id="newTask" placeholder="Nieuwe taak…"><select id="newWho"><option>Claude</option><option>Berend</option></select><button class="btn" id="addTask">Toevoegen</button></div>
      <div class="todos">${rows || '<p class="muted">Niets te doen.</p>'}</div>`;
    $('#view').querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = async () => {
      const { error } = await sb.from('hub_todo').update({ klaar: c.checked, updated_at: new Date().toISOString() }).eq('id', +c.dataset.id);
      toast(error ? 'Fout: ' + error.message : (c.checked ? 'Afgevinkt' : 'Weer open')); if (!error) show(); });
    $('#view').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const { error } = await sb.from('hub_todo').delete().eq('id', +b.dataset.del); toast(error ? 'Fout: ' + error.message : 'Verwijderd'); if (!error) show(); });
    const add = async () => { const v = $('#newTask').value.trim(); if (!v) return;
      const { error } = await sb.from('hub_todo').insert({ taak: v, wie: $('#newWho').value, volgorde: 99 }); toast(error ? 'Fout: ' + error.message : 'Toegevoegd'); if (!error) show(); };
    $('#addTask').onclick = add; $('#newTask').onkeydown = e => { if (e.key === 'Enter') add(); };
    editable($('#view'));

  async Shorts() { return TABS.Planning('shorts'); },
  async Shots() {
    const { data } = await sb.from('hub_shots').select('*').order('video').order('nr');
    const groups = {};
    (data||[]).forEach(s => (groups[s.video] ??= []).push(s));
    let html = '<h2>Shots per video</h2><p class="muted">Status: idee → foto → foto goedgekeurd → gefilmd → gecontroleerd → goedgekeurd</p>';
    for (const [v, list] of Object.entries(groups)) {
      html += `<h2 style="margin-top:22px;color:var(--txt)">${esc(v)}</h2><table><tr><th>Shot</th><th>Wat</th><th>Bestand</th><th>Status</th><th>Notitie</th></tr>`;
      for (const s of list) {
        const m = esc(JSON.stringify({id:s.id}));

      html += '</table>';

    $('#view').innerHTML = html; editable($('#view'));

  async 'Kosten & credits'() {

    $('#view').innerHTML = `<h2>Credits & regels</h2><div class="grid">${cards}</div>

      <table><tr><th>Datum</th><th>Post</th><th>Bedrag</th><th>Notitie</th></tr>${rows || '<tr><td colspan="4" class="muted">Nog geen kosten geboekt.</td></tr>'}</table>`;
    editable($('#view'));

  async Links() {
    const { data } = await sb.from('hub_links').select('*').order('volgorde');
    $('#view').innerHTML = `<h2>Links</h2><div class="grid">${(data||[]).map(l => `<a class="card" href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.naam)}</b><div class="muted">${esc(l.url)}</div></a>`).join('')}</div>`;
  },
};

function tabs(active) {
  const order = [...Object.keys(TABS).filter(k => k !== 'Doelen' && k !== 'To-do'), 'Doelen', 'To-do'];
  $('#tabs').innerHTML = order.map(k => `<button class="${k===active?'on':''}">${k}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { location.hash = b.textContent; show(); });
}
async function show() {
  const t = decodeURIComponent(location.hash.slice(1)) || 'Planning';
  const name = TABS[t] ? t : 'Planning';
  tabs(name); $('#view').innerHTML = '<p class="muted">Laden…</p>';
  try { await TABS[name](); } catch (e) { $('#view').innerHTML = '<p>Fout bij laden: ' + esc(e.message) + '</p>'; }
}
let shownFor = null; // voorkomt dubbel laden en flikkeren van het inlogscherm
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  $('#login').hidden = !!session; $('#app').hidden = !session;
  const who = session ? session.user.email : null;
  if (session && shownFor !== who) { $('#who').textContent = who; show(); }
  shownFor = who;
}
$('#go').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  $('#msg').textContent = error ? error.message : ''; start();
};
$('#su').onclick = async () => {
  const { error } = await sb.auth.signUp({ email: $('#em').value, password: $('#pw').value, options: { emailRedirectTo: location.href.split('#')[0] } });
  $('#msg').textContent = error ? error.message : 'Check je mail en klik op de bevestigingslink. Daarna inloggen.';
};
$('#fg').onclick = async (e) => {
  e.preventDefault();
  if (!$('#em').value) { $('#msg').textContent = 'Vul eerst je e-mailadres in.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail($('#em').value, { redirectTo: location.href.split('#')[0] });
  $('#msg').textContent = error ? error.message : 'Check je mail: klik op de link en kies een nieuw wachtwoord.';
};
$('#setpw').onclick = async () => {
  const { error } = await sb.auth.updateUser({ password: $('#pw2').value });
  $('#msg').textContent = error ? error.message : 'Nieuw wachtwoord opgeslagen.';
  if (!error) { recovering = false; $('#newpw').hidden = true; start(); }
};
let recovering = false;
$('#out').onclick = async () => { await sb.auth.signOut(); start(); };
window.addEventListener('hashchange', show);
sb.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') { recovering = true; $('#app').hidden = true; $('#login').hidden = false; $('#newpw').hidden = false; $('#msg').textContent = 'Kies een nieuw wachtwoord.'; return; }
  if (ev !== 'TOKEN_REFRESHED' && !recovering) start();
});
</script>
</body>
</html>
