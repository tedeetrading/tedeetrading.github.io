<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DAMSUNZ Hub</title>
<link rel="icon" type="image/png" href="favicon_rond.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#0b0b0b; --card:#151311; --line:#2a2622; --sun:#FFC42E; --orange:#FF8A1E; --txt:#FFF6E6; --dim:#a39a8e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  .logo { font-weight:800; letter-spacing:.2em; background:linear-gradient(90deg,var(--sun),var(--orange)); -webkit-background-clip:text; color:transparent; font-size:18px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; margin-left:12px; }
  nav button { background:none; border:1px solid var(--line); color:var(--dim); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:14px; }
  nav button.on { color:#111; background:var(--sun); border-color:var(--sun); font-weight:600; }
  .spacer { flex:1; }
  .who { color:var(--dim); font-size:13px; }
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  @media (max-width:1100px){ .duo{grid-template-columns:1fr} }
  main { max-width:1500px; margin:0 auto; padding:22px; }
  h2 { font-size:18px; margin:0 0 14px; color:var(--sun); font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  tr.sep td { padding:0; height:6px; background:var(--bg); border:0; }
  tr.today td { background:#2a1f0d; }
  td.b { font-weight:700; }
  [contenteditable] { outline:none; border-radius:6px; padding:2px 4px; margin:-2px -4px; }
  [contenteditable]:hover { background:#221d17; }
  [contenteditable]:focus { background:#2d2519; box-shadow:0 0 0 1px var(--orange); }
  .muted { color:var(--dim); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card b { color:var(--sun); }
  a { color:var(--sun); }
  #login { max-width:360px; margin:12vh auto; text-align:center; }
  #login input { width:100%; padding:11px; margin:6px 0; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--txt); font-size:15px; }
  .btn { background:var(--sun); color:#111; border:0; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; font-size:15px; }
  .btn.ghost { background:none; color:var(--dim); border:1px solid var(--line); }
  .toast { position:fixed; bottom:18px; right:18px; background:var(--card); border:1px solid var(--orange); padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
  td.kanaal { text-align:center; vertical-align:middle; }
  .icons { display:inline-flex; align-items:center; gap:5px; }
  .ic { display:inline-flex; align-items:center; }
  .ic svg, .ic img { display:block; }
  .c-more { display:none; }
  .selecting tr[data-id] { cursor:pointer; }
  tr.sel td { background:#3a2a0a !important; }
  tr.sel { outline:2px solid var(--sun); outline-offset:-2px; }
  .btn:disabled { opacity:.45; cursor:default; }

  .morebtns { display:flex; gap:8px; margin-top:4px; }
  .morebtns .btn { text-decoration:none; font-size:13px; padding:8px 12px; }
  .pill.ok { color:#111; background:var(--sun); border-color:var(--sun); }
  .niche { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); background:none; cursor:pointer; white-space:nowrap; }
  .niche.set { color:#111; background:var(--sun); border-color:var(--sun); }
  .rv { display:grid; grid-template-columns:minmax(0,460px) 1fr; gap:22px; align-items:start; }
  @media (max-width:900px){ .rv{grid-template-columns:1fr} }

  .rvbar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }

  .rv textarea { width:100%; min-height:90px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); font:15px/1.4 system-ui; }
  .rvlist { display:grid; gap:6px; max-height:70vh; overflow:auto; }
  .rvit { display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer; font-size:14px; }
  .rvit.on { outline:2px solid var(--sun); }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; flex:none; } .dot.akkoord{background:#2fbf5b} .dot.feedback{background:var(--orange)} .dot.afgekeurd{background:#d9434b}
  .rvhist { font-size:13px; color:var(--dim); margin-top:8px; display:grid; gap:4px; }
  .fmenu { position:absolute; right:0; top:calc(100% + 6px); z-index:5; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:200px; display:grid; gap:2px; box-shadow:0 8px 24px #0008; }

  .infoi:hover { opacity:1; color:var(--sun); border-color:var(--sun); }

  .heart { background:none; border:0; cursor:pointer; font-size:18px; line-height:1; padding:0 2px; margin-left:8px; vertical-align:middle; color:var(--dim); opacity:.55; }
  .heart.on { color:#ff4d6d; opacity:1; }
  .heart:hover { opacity:1; }
  .c-niche { white-space:nowrap; }
  select.nichesel { font-size:13px; background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:3px 6px; }
  .tree { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:18px; }
  .tree .card h3 { font-size:14px; margin:0 0 8px; color:var(--txt); font-weight:600; }
  .np { display:inline-block; font-size:12px; padding:3px 9px; border-radius:999px; margin:3px 3px 0 0; border:1px solid var(--line); color:var(--dim); cursor:pointer; background:none; }
  .np.has { color:#111; background:var(--sun); border-color:var(--sun); }
  .np.on { outline:2px solid var(--sun); outline-offset:1px; }
  .idtag { font-size:11px; color:var(--dim); margin-left:4px; }
  .idtag:empty::before { content: attr(data-ph); opacity:.5; }
  td { white-space:normal; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--dim); }
  @media (max-width:700px){
    header { padding:10px 12px; gap:8px; flex-wrap:nowrap; }
    .logo { font-size:15px; letter-spacing:.12em; }
    nav { margin-left:4px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    nav button { white-space:nowrap; padding:5px 10px; font-size:13px; }

    tr:not(.sep) { display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"date date status" "title title heart" "niche niche niche" "kanaal len ctl" "more more more"; cursor:pointer; align-items:center;
      gap:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
    td { border:0; padding:0; }

    .c-video { display:contents; } .vrow { display:contents; } .songctl.ph { display:none; }
    .c-video .ttl { grid-area:title; font-size:17px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .c-video:not(.b) .ttl { font-weight:500; }
    .c-video .ttl a { font-size:17px; }
    .c-video > .idtag { display:none; }
    .c-video .songctl { grid-area:ctl; margin:0; justify-self:end; gap:8px; }
    .songctl .playbtn, .songctl .qbtn { width:34px; height:34px; font-size:13px; }
    .songctl .qbtn { border:1px solid var(--line); font-size:16px; }
    .c-kanaal { grid-area:kanaal; text-align:left !important; }
    .c-video .heart { grid-area:heart; justify-self:end; margin:0; font-size:22px; }
    .c-niche { grid-area:niche; }
    .c-niche:empty { display:none; }
    .c-len { grid-area:len; color:var(--dim); font-size:13px; text-align:left; }
    .c-len::before { content:'· '; }
  }
  .kpis { display:grid; grid-template-columns:repeat(2,minmax(120px,170px)) minmax(220px,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .kpi .kv { font-size:32px; font-weight:800; line-height:1.1; background:linear-gradient(90deg,var(--sun),var(--orange)); -webkit-background-clip:text; color:transparent; }
  .kpi .kv.dim { background:none; color:var(--txt); }
  .kpi .kl { color:var(--dim); font-size:13px; }
  .kbar { height:8px; border-radius:8px; background:#2a2622; overflow:hidden; margin-top:8px; }
  .kbar i { display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,var(--sun),var(--orange)); }
  @media (max-width:700px){ .kpis { grid-template-columns:1fr 1fr; } .kpi.wide { grid-column:1 / -1; } }
  .todoadd { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .todoadd input, .todoadd select { background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px 12px; font-size:15px; }
  .todoadd input { flex:1; min-width:200px; }
  .todos { display:grid; gap:8px; }
  .todo { display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .todo input[type=checkbox] { width:22px; height:22px; accent-color:var(--sun); margin-top:2px; flex:none; cursor:pointer; }
  .todo .tt { flex:1; min-width:0; display:grid; gap:4px; }
  .todo.done .tt > div:first-child { text-decoration:line-through; color:var(--dim); }
  .tdel { background:none; border:0; color:var(--dim); cursor:pointer; font-size:14px; }
  .tbar { display:flex; gap:10px; flex-wrap:wrap; }
  @media (max-width:700px){
    .tbar { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; width:100%; }
    .tbar:has(#swapBtn:not([hidden])) .shufmob { display:none; }
    .tbar .btn { padding:9px 4px; font-size:13px; white-space:nowrap; text-align:center; }
    .tbar .lg { display:none; }
  }
  .shufmob { display:none; }
  @media (max-width:700px){ .shufmob { display:inline-block; } }
  .shufbtn { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; border:0; background:var(--sun); color:#111; box-shadow:0 2px 10px #ffc42e55; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .shufbtn:hover { background:var(--orange); }
  .shufbtn svg { width:16px; height:16px; fill:currentColor; }
  .kpis.fin { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .kpis.fin .kv { font-size:26px; }
  @media (max-width:700px){ .kpis.fin { grid-template-columns:1fr 1fr; } .kpis.fin .kv { font-size:20px; }
    .fintab tr { display:block !important; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
    .fintab td { display:inline-block; padding:2px 8px 2px 0; } .fintab tr:has(th) { display:none !important; } }
  .songctl { display:inline-flex; gap:6px; align-items:center; margin-left:8px; vertical-align:middle; }
  .playbtn { width:30px; height:30px; border-radius:50%; border:none; background:var(--sun); color:#111; font-size:13px; cursor:pointer; padding:0; }
  .playbtn.on { background:#ff8a1e; }
  .qbtn { width:30px; height:30px; border-radius:50%; border:none; background:none; color:var(--dim); font-size:18px; cursor:pointer; padding:0; line-height:1; letter-spacing:1px; }
  .qbtn:hover { color:var(--txt); background:#221d17; }
  #ctx { position:fixed; z-index:9; background:#282420; border-radius:6px; box-shadow:0 8px 24px #000a; padding:4px; min-width:210px; }
  #ctx[hidden] { display:none; }
  #ctx button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); padding:10px 12px; border-radius:4px; font-size:14px; cursor:pointer; }
  #ctx button:hover { background:#3a342d; }
  #pbar { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(180deg,#1a1714,#0e0c0b); border-top:1px solid #2f2a24; padding:10px 18px calc(10px + env(safe-area-inset-bottom)); z-index:6;
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr); grid-template-areas:"info ctrl side"; align-items:center; gap:14px; box-shadow:0 -10px 30px #0008; }
  #pbar[hidden] { display:none; }
  #pbar .pl { grid-area:info; display:flex; align-items:center; gap:12px; min-width:0; }
  #pbar .art { width:48px; height:48px; border-radius:8px; flex:none; background:#000 url(favicon_rond.png) center/cover; box-shadow:0 2px 10px #0009; }
  #pbar .meta { min-width:0; } #pbar .meta b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--txt); font-size:15px; }
  #pbar .meta span { font-size:12px; color:var(--dim); letter-spacing:.08em; }
  #pbar .pc { grid-area:ctrl; display:grid; gap:6px; justify-items:center; }
  #pbar .pbtns { display:flex; align-items:center; gap:22px; }

</head>
<body>
<div id="login" hidden>
  <div class="logo" style="font-size:28px">DAMSUNZ</div>
  <p class="muted">Hub · alleen voor TD Trading</p>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Wachtwoord" autocomplete="current-password">
  <p><button class="btn" id="go">Inloggen</button> <button class="btn ghost" id="su">Account aanmaken</button></p>
  <p><a href="#" id="fg" class="muted">Wachtwoord vergeten?</a></p>
  <div id="newpw" hidden><input id="pw2" type="password" placeholder="Nieuw wachtwoord" autocomplete="new-password"><p><button class="btn" id="setpw">Wachtwoord opslaan</button></p></div>
  <p class="muted" id="msg"></p>
</div>

<div id="app" hidden>
  <header>
    <span class="logo">DAMSUNZ</span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="out" style="padding:5px 10px;font-size:13px">Uit</button>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast">Opgeslagen</div>
<audio id="aud" preload="auto" playsinline></audio>
<div id="pbar" hidden></div>
<div id="qpanel" hidden></div>
<div id="ctx" hidden></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_KEY } from './config.js';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

async function signed(path) {
  const c = urlCache.get(path); if (c && c.until > Date.now()) return c.url;
  const { data, error } = await sb.storage.from('hub-songs').createSignedUrl(path, 3600);
  if (error) throw error;
  urlCache.set(path, { url: data.signedUrl, until: Date.now() + 50 * 60 * 1000 }); return data.signedUrl;
}

function mediaSession() {

async function playItem(item, fromBack) {

let autoPaused = false, fadeTimer = null;

  fadeTimer = setInterval(() => { const f = Math.min(1, (Date.now() - t0) / (sec * 1000)); player.volume = v0 * (1 - f) * (1 - f); if (f >= 1) { clearInterval(fadeTimer); player.pause(); player.volume = 1; } }, 40); }
function fadeIn(sec = 2) {
  clearInterval(fadeTimer); player.volume = 0; const t0 = Date.now();
  fadeTimer = setInterval(() => { const f = Math.min(1, (Date.now() - t0) / (sec * 1000)); player.volume = f * f; if (f >= 1) clearInterval(fadeTimer); }, 50);
}

  async 'Kosten & credits'() {

    const rate = parseFloat(String(I.koers_usd_eur || '0.86').replace(',', '.')) || 0.86;
    const eur = (b, v) => Number(b) * (v === 'USD' ? rate : 1);
    const EU = n => '€ ' + n.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const orig = (b, v) => (v === 'USD' ? '$ ' : '€ ') + Number(b).toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const monthsSince = d => { const a = new Date(d + 'T12:00:00'), n = new Date(); return (n.getFullYear() - a.getFullYear()) * 12 + (n.getMonth() - a.getMonth()) - (n.getDate() < a.getDate() ? 1 : 0); };
    const paidCycles = x => { if (x.status === 'gepland' || !x.sinds || !Number(x.bedrag)) return 0;

    const losPaid = (kost || []).reduce((t, k) => t + eur(k.bedrag, k.valuta), 0);
    const totaal = aboPaid + losPaid;
    const maandNu = A.filter(x => x.status === 'actief').reduce((t, x) => t + perMaand(x), 0);
    const maandGepland = A.filter(x => x.status === 'gepland').reduce((t, x) => t + perMaand(x), 0);
    const kpis = `<div class="kpis fin"><div class="kpi"><div class="kv">${EU(totaal)}</div><div class="kl">Totaal uitgegeven tot nu</div></div>
      <div class="kpi"><div class="kv dim">${EU(maandNu)}</div><div class="kl">Vaste kosten per maand (nu)</div></div>
      <div class="kpi"><div class="kv dim">${EU(maandNu + maandGepland)}</div><div class="kl">Per maand incl. gepland (${EU(maandGepland)} erbij)</div></div>
      <div class="kpi"><div class="kv dim">${esc(I.fal_tegoed_over || '–')}</div><div class="kl">fal.ai-tegoed over</div></div></div>`;
    const stPill = st => `<span class="pill ${st === 'actief' ? 'ok' : ''}">${esc(st)}</span>`;
    const aboRows = A.map(x => { const m = esc(JSON.stringify({ id: x.id })), c = paidCycles(x);
      return `<tr><td class="b">${esc(x.dienst)}</td><td class="muted">${esc(x.wat || '')}</td>
        <td><span data-t="hub_abonnementen" data-m="${m}" data-f="bedrag">${esc(x.bedrag)}</span> ${x.valuta === 'USD' ? '$' : '€'} <span class="muted">/ ${esc(x.periode)}</span></td>
        <td>${x.sinds ? nlDatum(x.sinds) : '–'}</td><td><span data-t="hub_abonnementen" data-m="${m}" data-f="status">${esc(x.status)}</span></td>
        <td class="b">${c ? EU(c * eur(x.bedrag, x.valuta)) : '–'}</td><td class="muted" data-t="hub_abonnementen" data-m="${m}" data-f="notitie">${esc(x.notitie || '')}</td></tr>`; }).join('');
    const losRows = (kost || []).map(k => `<tr><td>${nlDatum(k.datum)}</td><td>${esc(k.post)}</td><td>${orig(k.bedrag, k.valuta)}</td><td class="b">${EU(eur(k.bedrag, k.valuta))}</td>
      <td class="muted">${esc(k.notitie || '')}</td><td><button class="tdel" data-delk="${k.id}" title="Verwijderen">✕</button></td></tr>`).join('');
    const cards = (info || []).filter(i => !['koers_usd_eur', 'fal_tegoed_over'].includes(i.key)).map(i => `<div class="card"><div class="muted">${esc(i.key.replaceAll('_', ' '))}</div>
      <b data-t="hub_info" data-m="${esc(JSON.stringify({ key: i.key }))}" data-f="value">${esc(i.value)}</b></div>`).join('');
    $('#view').innerHTML = `<h2>Financieel overzicht</h2>${kpis}
      <h2 style="margin-top:22px">Abonnementen</h2><table class="fintab"><tr><th>Dienst</th><th>Wat</th><th>Bedrag</th><th>Sinds</th><th>Status</th><th>Betaald tot nu</th><th>Notitie</th></tr>${aboRows}</table>
      <h2 style="margin-top:22px">Losse betalingen <span class="pill">${EU(losPaid)}</span></h2>
      <div class="todoadd"><input id="kDatum" type="date" value="${today}"><input id="kPost" placeholder="Waarvoor (bv. fal.ai tegoed)"><input id="kBedrag" type="number" step="0.01" placeholder="Bedrag" style="max-width:120px;min-width:90px">
        <select id="kVal"><option>USD</option><option>EUR</option></select><button class="btn" id="kAdd">Toevoegen</button></div>
      <table class="fintab"><tr><th>Datum</th><th>Waarvoor</th><th>Bedrag</th><th>In euro</th><th>Notitie</th><th></th></tr>${losRows || '<tr><td colspan="6" class="muted">Nog niets.</td></tr>'}</table>
      <p class="muted">Dollars omgerekend met koers ${String(rate).replace('.', ',')} (schatting). Jaarabonnementen tellen per jaar mee; maandabonnementen elke maand vanaf de startdatum.</p>
      <h2 style="margin-top:22px">Credits & regels</h2><div class="grid">${cards}</div>`;
    $('#kAdd').onclick = async () => { const b = parseFloat($('#kBedrag').value); if (!$('#kPost').value.trim() || !b) return toast('Vul waarvoor + bedrag in');
      const { error } = await sb.from('hub_kosten').insert({ datum: $('#kDatum').value, post: $('#kPost').value.trim(), bedrag: b, valuta: $('#kVal').value });
      toast(error ? 'Fout: ' + error.message : 'Toegevoegd'); if (!error) show(); };
    $('#view').querySelectorAll('[data-delk]').forEach(btn => btn.onclick = async () => {
      const { error } = await sb.from('hub_kosten').delete().eq('id', +btn.dataset.delk); toast(error ? 'Fout: ' + error.message : 'Verwijderd'); if (!error) show(); });
    editable($('#view'));
  },
  async Links() {
    const { data } = await sb.from('hub_links').select('*').order('volgorde');
    $('#view').innerHTML = `<h2>Links</h2><div class="grid">${(data||[]).map(l => `<a class="card" href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.naam)}</b><div class="muted">${esc(l.url)}</div></a>`).join('')}</div>`;
  },
};

function tabs(active) {
  const order = [...Object.keys(TABS).filter(k => k !== 'Doelen' && k !== 'To-do'), 'Doelen', 'To-do'];
  $('#tabs').innerHTML = order.map(k => `<button class="${k===active?'on':''}">${k}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { location.hash = b.textContent; show(); });
}
async function show() {
  let t = decodeURIComponent(location.hash.slice(1)) || 'Planning'; if (t === 'Niches') t = 'Stijlen';
  const name = TABS[t] ? t : 'Planning';
  tabs(name); $('#view').innerHTML = '<p class="muted">Laden…</p>';
  try { await TABS[name](); } catch (e) { $('#view').innerHTML = '<p>Fout bij laden: ' + esc(e.message) + '</p>'; }
}
let shownFor = null; // voorkomt dubbel laden en flikkeren van het inlogscherm
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  $('#login').hidden = !!session; $('#app').hidden = !session;
  const who = session ? session.user.email : null;
  if (session && shownFor !== who) { $('#who').textContent = who; show(); }
  shownFor = who;
}
$('#go').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  $('#msg').textContent = error ? error.message : ''; start();
};
$('#su').onclick = async () => {
  const { error } = await sb.auth.signUp({ email: $('#em').value, password: $('#pw').value, options: { emailRedirectTo: location.href.split('#')[0] } });
  $('#msg').textContent = error ? error.message : 'Check je mail en klik op de bevestigingslink. Daarna inloggen.';
};
$('#fg').onclick = async (e) => {
  e.preventDefault();
  if (!$('#em').value) { $('#msg').textContent = 'Vul eerst je e-mailadres in.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail($('#em').value, { redirectTo: location.href.split('#')[0] });
  $('#msg').textContent = error ? error.message : 'Check je mail: klik op de link en kies een nieuw wachtwoord.';
};
$('#setpw').onclick = async () => {
  const { error } = await sb.auth.updateUser({ password: $('#pw2').value });
  $('#msg').textContent = error ? error.message : 'Nieuw wachtwoord opgeslagen.';
  if (!error) { recovering = false; $('#newpw').hidden = true; start(); }
};
let recovering = false;
$('#out').onclick = async () => { await sb.auth.signOut(); start(); };
window.addEventListener('hashchange', show);
// filtermenu sluiten bij klik ernaast of Esc
document.addEventListener('click', e => { const ib = e.target.closest('.infoi'); if (ib) { e.stopPropagation(); toast(ib.dataset.info); } }, true);
document.addEventListener('click', e => { const m = $('#fmenu'); if (m && !m.hidden && !e.target.closest('#fmenu,#fBtn')) m.hidden = true; });
document.addEventListener('keydown', e => { const m = $('#fmenu'); if (e.key === 'Escape' && m) m.hidden = true; });
sb.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') { recovering = true; $('#app').hidden = true; $('#login').hidden = false; $('#newpw').hidden = false; $('#msg').textContent = 'Kies een nieuw wachtwoord.'; return; }
  if (ev !== 'TOKEN_REFRESHED' && !recovering) start();
});
</script>
</body>
</html>
